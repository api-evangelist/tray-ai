openapi: 3.2.0
info:
  title: Tray Ai Users API
  version: 1.0.0
  x-refined-note:
  - x-logo differs across the merged source definitions and was not carried
  description: 'Operations tagged Users across 4 of this provider''s published API definitions: tray-ai-embedded-api-openapi.yml, tray-ai-embedded-api-published-openapi.yaml, tray-ai-platform-api-openapi.yml, tray-ai-platform-api-published-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://tray.io
  description: US Region (Default)
- url: https://eu1.tray.io
  description: EU Region
- url: https://ap1.tray.io
  description: APAC Region
- url: https://tray.io/graphql
  description: US
- url: https://eu1.tray.io/graphql
  description: EU
- url: https://ap1.tray.io/graphql
  description: APAC
- url: https://api.tray.io/core/v1
  description: US Region (Default)
- url: https://api.eu1.tray.io/core/v1
  description: EU Region
- url: https://api.ap1.tray.io/core/v1
  description: APAC Region
- url: https://api.tray.io
  description: US
- url: https://api.eu1.tray.io
  description: EU
- url: https://api.ap1.tray.io
  description: APAC
security:
- bearerAuth: []
tags:
- name: Users
  description: Manage external users of your embedded application. Requires a master token for most operations.
paths:
  /graphql:
    post:
      operationId: createExternalUser
      summary: Tray.ai Create External User
      description: Creates a new external user for your embedded application. Accepts a name, externalUserId, and optional isTestUser flag. Test users are excluded from billing. Requires a master token.
      tags:
      - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQLRequest'
            example:
              query: "mutation {\n  createExternalUser(input: {\n    name: \"Jane Doe\",\n    externalUserId: \"user-123\",\n    isTestUser: false\n  }) {\n    userId\n  }\n}"
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      createExternalUser:
                        type: object
                        properties:
                          userId:
                            type: string
                            description: The unique identifier for the created user
        '401':
          $ref: '#/components/responses/Unauthorized'
    servers:
    - url: https://tray.io
      description: US Region (Default)
    - url: https://eu1.tray.io
      description: EU Region
    - url: https://ap1.tray.io
      description: APAC Region
  /graphql#getUsers:
    post:
      operationId: getUsers
      summary: Tray.ai Get Users
      description: Retrieves a list of external users with pagination support. Returns user details including name, id, externalUserId, and pagination cursor information. Requires a master token.
      tags:
      - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQLRequest'
            example:
              query: "query {\n  users {\n    edges {\n      node {\n        id\n        name\n        externalUserId\n      }\n      cursor\n    }\n    pageInfo {\n      hasNextPage\n      endCursor\n      hasPreviousPage\n      startCursor\n    }\n  }\n}"
      responses:
        '200':
          description: List of users returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      users:
                        type: object
                        properties:
                          edges:
                            type: array
                            items:
                              type: object
                              properties:
                                node:
                                  $ref: '#/components/schemas/User'
                                cursor:
                                  type: string
                          pageInfo:
                            $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
    servers:
    - url: https://tray.io
      description: US Region (Default)
    - url: https://eu1.tray.io
      description: EU Region
    - url: https://ap1.tray.io
      description: APAC Region
  /graphql#updateExternalUser:
    post:
      operationId: updateExternalUser
      summary: Tray.ai Update External User
      description: Updates an external user's properties, such as marking them as a test user to exclude from billing. Requires a master token.
      tags:
      - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQLRequest'
            example:
              query: "mutation {\n  updateExternalUser(input: {\n    userId: \"user-uuid-here\",\n    isTestUser: true\n  }) {\n    userId\n  }\n}"
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updateExternalUser:
                        type: object
                        properties:
                          userId:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    servers:
    - url: https://tray.io
      description: US Region (Default)
    - url: https://eu1.tray.io
      description: EU Region
    - url: https://ap1.tray.io
      description: APAC Region
  /graphql#removeUser:
    post:
      operationId: removeUser
      summary: Tray.ai Remove User
      description: Removes an external user from your embedded application. This will also remove all associated solution instances and authentications. Requires a master token.
      tags:
      - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQLRequest'
            example:
              query: "mutation {\n  removeUser(input: {\n    userId: \"user-uuid-here\"\n  }) {\n    clientMutationId\n  }\n}"
      responses:
        '200':
          description: User removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      removeUser:
                        type: object
                        properties:
                          clientMutationId:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    servers:
    - url: https://tray.io
      description: US Region (Default)
    - url: https://eu1.tray.io
      description: EU Region
    - url: https://ap1.tray.io
      description: APAC Region
  /:
    post:
      tags:
      - Users
      summary: Get users (master token)
      description:
        $ref: descriptions/embedded/endpoints/users/getUsers.md
      operationId: get-users
      x-codeSamples:
      - lang: cURL
        label: curl
        source:
          $ref: code_samples/users/getUsers.curl
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer 3fd74d349xxxxxxxxxxxxxxxxxxxxxxxxd90df521
        description: Pass your <a target="_blank" href="https://tray.ai/documentation/tray-uac/embedded-integrations/setup-notes/">master token</a> here
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                variables:
                  type: object
            examples:
              get-all-users:
                summary: Get all users
                value:
                  query: "query {\n    users {\n        edges {\n            node {\n                name\n                id\n                externalUserId\n            }\n            cursor\n        }\n        pageInfo {\n          hasNextPage\n          endCursor\n          hasPreviousPage\n          startCursor\n        }\n    }\n}"
                  variables: {}
              get-user-by-id:
                summary: Get user by id
                value:
                  query: "query {\n    users (criteria: {userId: \"13b3ab9c-XXXX-XXXX-XXXX-c4dd07fbbfa4\"}){\n        edges {\n            node {\n                name\n                id\n                externalUserId\n            }\n            cursor\n        }\n        pageInfo {\n          hasNextPage\n          endCursor\n          hasPreviousPage\n          startCursor\n        }\n    }\n}"
                  variables: {}
              get-user-by-externalId:
                summary: Get user by externalId
                value:
                  query: "query {\n    users (criteria: {externalUserId: \"13b3ab9c-XXXX-XXXX-XXXX-c4dd07fbbfa4\"}){\n        edges {\n            node {\n                name\n                id\n                externalUserId\n            }\n            cursor\n        }\n        pageInfo {\n          hasNextPage\n          endCursor\n          hasPreviousPage\n          startCursor\n        }\n    }\n}"
                  variables: {}
              get-users-after-cursor:
                summary: Get users after cursor
                value:
                  query: "query {\n    users (after: \"MTNiM2FiOWMtZTIyMi00NzM5LWE2OWItYzRkZDA3ZmJiZmE0\"){\n        edges {\n            node {\n                name\n                id\n                externalUserId\n            }\n            cursor\n        }\n        pageInfo {\n          hasNextPage\n          endCursor\n          hasPreviousPage\n          startCursor\n        }\n    }\n}"
                  variables: {}
              get-first-2-users:
                summary: Get first 2 users
                value:
                  query: "query {\n    users (first: 2){\n        edges {\n            node {\n                name\n                id\n                externalUserId\n            }\n            cursor\n        }\n        pageInfo {\n          hasNextPage\n          endCursor\n          hasPreviousPage\n          startCursor\n        }\n    }\n}"
                  variables: {}
              get-first-5-users-after-cursor:
                summary: Get first 5 users after cursor
                value:
                  query: "query {\n    users (first: 5, after: \"MTNiM2FiOWMtZTIyMi00NzM5LWE2OWItYzRkZDA3ZmJiZmE0\"){\n        edges {\n            node {\n                name\n                id\n                externalUserId\n            }\n            cursor\n        }\n        pageInfo {\n          hasNextPage\n          endCursor\n          hasPreviousPage\n          startCursor\n        }\n    }\n}"
                  variables: {}
        required: true
      responses:
        '200':
          description: OK - Returns the end users from your embedded org
          content:
            application/json:
              examples:
                get-all-users:
                  summary: Get all users
                  value:
                    $ref: examples/users/getUsersAll.json
                get-user-by-id:
                  summary: Get user by id
                  value:
                    $ref: examples/users/getUsersById.json
                get-user-by-externalId:
                  summary: Get user by externalId
                  value:
                    $ref: examples/users/getUsersByExternalId.json
                get-users-after-cursor:
                  summary: Get users after cursor
                  value:
                    $ref: examples/users/getUsersAfterCursor.json
                get-first-2-users:
                  summary: Get first 2 users
                  value:
                    $ref: examples/users/getUsersFirstTwo.json
                get-first-5-users-after-cursor:
                  summary: Get first 5 users after cursor
                  value:
                    $ref: examples/users/getUsersFiveAfterCursor.json
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                $ref: examples/401.json
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                $ref: examples/403.json
        '500':
          description: Internal Error
          content:
            application/json:
              example:
                $ref: examples/500.json
    servers:
    - url: https://tray.io/graphql
      description: US
    - url: https://eu1.tray.io/graphql
      description: EU
    - url: https://ap1.tray.io/graphql
      description: APAC
  '/ ':
    post:
      tags:
      - Users
      summary: Create new user (master token)
      description:
        $ref: descriptions/embedded/endpoints/users/createUser.md
      operationId: create-user
      x-codeSamples:
      - lang: cURL
        label: curl
        source:
          $ref: code_samples/users/createNewUser.curl
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer 3fd74d349xxxxxxxxxxxxxxxxxxxxxxxxd90df521
        description: Pass your <a target="_blank" href="https://tray.ai/documentation/tray-uac/embedded-integrations/setup-notes/">master token</a> here
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                variables:
                  type: object
            examples:
              create-billable-user:
                summary: Create user
                value:
                  query: "mutation($name: String!, $externalUserId: String!) {\n  createExternalUser(input: { \n      name: $name, \n      externalUserId: $externalUserId  \n    }) {\n      userId\n  }\n}"
                  variables:
                    name: Dwight Schrute
                    externalUserId: my-apps-user-id-for-dwight
              create-test-user:
                summary: Create test user
                value:
                  query: "mutation($name: String!, $externalUserId: String!, $isTestUser: Boolean) {\n  createExternalUser(input: { \n      name: $name, \n      externalUserId: $externalUserId,\n      isTestUser: $isTestUser\n    }) {\n      userId\n  }\n}"
                  variables:
                    name: Dwight Schrute
                    externalUserId: my-apps-user-id-for-dwight
                    isTestUser: true
        required: true
      responses:
        '200':
          description: OK - Returns the userId of the newly created user
          content:
            application/json:
              examples:
                create-billable-user:
                  summary: Create billable user
                  value:
                    $ref: examples/users/createBillableUser.json
                create-test-user:
                  summary: Create test user
                  value:
                    $ref: examples/users/createTestUser.json
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                $ref: examples/401.json
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                $ref: examples/403.json
        '500':
          description: Internal Error
          content:
            application/json:
              example:
                $ref: examples/500.json
    servers:
    - url: https://tray.io/graphql
      description: US
    - url: https://eu1.tray.io/graphql
      description: EU
    - url: https://ap1.tray.io/graphql
      description: APAC
  '/  ':
    post:
      tags:
      - Users
      summary: Create user token (master token)
      description:
        $ref: descriptions/embedded/endpoints/users/createUserToken.md
      operationId: create-user-token
      x-codeSamples:
      - lang: cURL
        label: curl
        source:
          $ref: code_samples/users/createUserToken.curl
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer 3fd74d349xxxxxxxxxxxxxxxxxxxxxxxxd90df521
        description: Pass your <a target="_blank" href="https://tray.ai/documentation/tray-uac/embedded-integrations/setup-notes/">master token</a> here
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                variables:
                  type: object
            examples:
              create-user-token:
                summary: Create user token
                value:
                  query: "mutation ($userId: ID!) {\n  authorize(input: {\n      userId: $userId\n  }) {\n    accessToken\n  }\n}"
                  variables:
                    userId: d869ec65-XXXX-XXXX-XXXX-ac5c1a3958b6
              create-user-token-with-clientMutationId:
                summary: Create user token with clientMutationId
                value:
                  query: "mutation ($userId: ID!, $clientMutationId: String) {\n  authorize(input: {\n      userId: $userId,\n      clientMutationId: $clientMutationId #OPTIONAL - only needed for legacy Relay & Apollo clients\n  }) {\n    accessToken\n    clientMutationId #OPTIONAL\n  }\n}"
                  variables:
                    userId: d869ec65-XXXX-XXXX-XXXX-ac5c1a3958b6
                    clientMutationId: my-mutation-id
        required: true
      responses:
        '200':
          description: OK - Returns the accessToken of the user
          content:
            application/json:
              examples:
                create-user-token:
                  summary: Create user token
                  value:
                    $ref: examples/users/createUserToken.json
                create-user-token-with-clientMutationId:
                  summary: Create user token with clientMutationId
                  value:
                    $ref: examples/users/createUserTokenWithCMID.json
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                $ref: examples/401.json
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                $ref: examples/403.json
        '500':
          description: Internal Error
          content:
            application/json:
              example:
                $ref: examples/500.json
    servers:
    - url: https://tray.io/graphql
      description: US
    - url: https://eu1.tray.io/graphql
      description: EU
    - url: https://ap1.tray.io/graphql
      description: APAC
  '/   ':
    post:
      tags:
      - Users
      summary: Create Auth/Config dialog Authorization Code (master token)
      description:
        $ref: descriptions/embedded/endpoints/users/createConfigWizardAuthCode.md
      operationId: create-config-wizard-auth-code
      x-codeSamples:
      - lang: cURL
        label: curl
        source:
          $ref: code_samples/users/createConfigWizardAuthCode.curl
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer 3fd74d349xxxxxxxxxxxxxxxxxxxxxxxxd90df521
        description: Pass your <a target="_blank" href="https://tray.ai/documentation/tray-uac/embedded-integrations/setup-notes/">master token</a> here
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                variables:
                  type: object
            examples:
              create-config-wizard-auth-code:
                summary: Create config wizard auth code
                value:
                  query: "mutation ($userId: ID!) {\n  generateAuthorizationCode( input: {\n    userId: $userId\n  }) {\n    authorizationCode\n  }\n}"
                  variables:
                    userId: d869ec65-XXXX-XXXX-XXXX-ac5c1a3958b6
              create-config-wizard-auth-code-with-clientMutationId:
                summary: Create config wizard auth code with clientMutationId
                value:
                  query: "mutation ($userId: ID!, $clientMutationId: String) {\n  generateAuthorizationCode( input: {\n    userId: $userId,\n    clientMutationId: $clientMutationId\n  }) {\n    authorizationCode\n    clientMutationId\n  }\n}"
                  variables:
                    userId: d869ec65-XXXX-XXXX-XXXX-ac5c1a3958b6
                    clientMutationId: my-mutation-id
        required: true
      responses:
        '200':
          description: OK - Returns the one time use authorizationCode for the user
          content:
            application/json:
              examples:
                create-config-wizard-auth-code:
                  summary: Create config wizard auth code
                  value:
                    $ref: examples/users/createConfigWizardAuthCode.json
                create-config-wizard-auth-code-with-clientMutationId:
                  summary: Create config wizard auth code with clientMutationId
                  value:
                    $ref: examples/users/createConfigWizardAuthCodeWithCMID.json
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                $ref: examples/401.json
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                $ref: examples/403.json
        '500':
          description: Internal Error
          content:
            application/json:
              example:
                $ref: examples/500.json
    servers:
    - url: https://tray.io/graphql
      description: US
    - url: https://eu1.tray.io/graphql
      description: EU
    - url: https://ap1.tray.io/graphql
      description: APAC
  '/    ':
    post:
      tags:
      - Users
      summary: Update user (master token)
      description:
        $ref: descriptions/embedded/endpoints/users/updateUser.md
      operationId: update-user
      x-codeSamples:
      - lang: cURL
        label: curl
        source:
          $ref: code_samples/users/updateUserEnable.curl
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer 3fd74d349xxxxxxxxxxxxxxxxxxxxxxxxd90df521
        description: Pass your <a target="_blank" href="https://tray.ai/documentation/tray-uac/embedded-integrations/setup-notes/">master token</a> here
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                variables:
                  type: object
            examples:
              update-user:
                summary: Update user
                value:
                  query: "mutation  ($userId: ID!, $isTestUser: Boolean ){\n   updateExternalUser(input: {\n      userId: $userId,\n      isTestUser: $isTestUser\n  }) {\n    user{\n\t\t\tname\n\t\t\tid\n\t\t\texternalUserId\n\t\t\tisTestUser\n\t\t}\n  }\n}"
                  variables:
                    userId: 53824943-XXXX-XXXX-XXXX-088aee14038e
                    isTestUser: true
              update-user-with-clientMutationId:
                summary: Update user with clientMutationId
                value:
                  query: "mutation  ($userId: ID! $isTestUser: Boolean $clientMutationId: String){\n   updateExternalUser(input: {\n      userId: $userId,\n      isTestUser: $isTestUser,\n      clientMutationId: $clientMutationId\n  }) {\n    user{\n\t\t\tname\n\t\t\tid\n\t\t\texternalUserId\n\t\t\tisTestUser\n            clientMutationId\n\t\t}\n  }\n}"
                  variables:
                    userId: ad15b7ae-4c2d-4574-bf4f-5e8e1097a6e9
                    isTestUser: true
                    clientMutationId: some-mutation-id
        required: true
      responses:
        '200':
          description: OK - Updates the user with the new data provided
          content:
            application/json:
              examples:
                update-user:
                  summary: Update user
                  value:
                    $ref: examples/users/updateUser.json
                update-user-with-clientMutationId:
                  summary: Update user with clientMutationId
                  value:
                    $ref: examples/users/updateUserWithCMID.json
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                $ref: examples/401.json
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                $ref: examples/403.json
        '500':
          description: Internal Error
          content:
            application/json:
              example:
                $ref: examples/500.json
    servers:
    - url: https://tray.io/graphql
      description: US
    - url: https://eu1.tray.io/graphql
      description: EU
    - url: https://ap1.tray.io/graphql
      description: APAC
  '/     ':
    post:
      tags:
      - Users
      summary: Delete user (master token)
      description:
        $ref: descriptions/embedded/endpoints/users/deleteUser.md
      operationId: delete-user
      x-codeSamples:
      - lang: cURL
        label: curl
        source:
          $ref: code_samples/users/deleteUser.curl
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer 3fd74d349xxxxxxxxxxxxxxxxxxxxxxxxd90df521
        description: Pass your <a target="_blank" href="https://tray.ai/documentation/tray-uac/embedded-integrations/setup-notes/">master token</a> here
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                variables:
                  type: object
            examples:
              delete-user:
                summary: Delete user
                value:
                  query: "mutation {\n  removeExternalUser(input: {userId: $userId}) {\n      clientMutationId # REQUIRED - must specify as return field, not required to provide this in mutation function\n  }\n}"
                  variables:
                    userId: 53824943-XXXX-XXXX-XXXX-088aee14038e
              delete-user-with-clientMutationId:
                summary: Delete user with clientMutationId
                value:
                  query: "mutation {\n  removeExternalUser(input: {\n      userId: $userId, \n      clientMutationId: $clientMutationId\n  }) {\n      clientMutationId # REQUIRED - must specify as return field\n  }\n}"
                  variables:
                    userId: 53824943-XXXX-XXXX-XXXX-088aee14038e
                    clientMutationId: someClientMutationId
        required: true
      responses:
        '200':
          description: OK - Deletes the end user
          content:
            application/json:
              examples:
                delete-user:
                  summary: Delete user
                  value:
                    $ref: examples/users/deleteUser.json
                delete-user-with-clientMutationId:
                  summary: Delete user with clientMutationId
                  value:
                    $ref: examples/users/deleteUserWithCMID.json
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                $ref: examples/401.json
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                $ref: examples/403.json
        '500':
          description: Internal Error
          content:
            application/json:
              example:
                $ref: examples/500.json
    servers:
    - url: https://tray.io/graphql
      description: US
    - url: https://eu1.tray.io/graphql
      description: EU
