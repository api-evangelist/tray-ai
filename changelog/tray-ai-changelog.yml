  - date: '2026-08-19'
    category: Features
    title: Tray Sync CLI
    url: https://tray.ai/documentation/releases/features/tray-sync-cli.md
    breaking: false
    highlights:
      - Clone Tray projects to a local directory for version control.
      - Promote projects between Tray environments, with a dry run first.
      - Local checksum-based drift detection with zero API calls.
      - A promotion is refused outright if any project or authentication mapping is unresolved.
  - date: '2026-07-14'
    category: Features
    title: Log Masking
    url: https://tray.ai/documentation/releases/features/log-masking.md
    breaking: false
    highlights:
      - Admins and Workspace Admins can mask a step's input and output values in execution logs.
      - Reveals are recorded in the audit log; a central Data masking view lists every masked step.
      - Gated — access is requested through a Customer Success Manager.
