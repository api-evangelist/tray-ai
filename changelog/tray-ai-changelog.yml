description: >-
  Tray.ai publishes a dated, categorised release-notes feed covering the platform, its connectors
  and its developer tooling. It is published as clean markdown at a stable URL, split per year
  (releases.md carries the current year plus last year; releases-{YYYY}.md the archives), which
  makes it one of the few genuinely machine-readable changelogs in the iPaaS cohort. It is a
  PRODUCT changelog rather than an API changelog: neither published OpenAPI is versioned in it,
  and no entry records a breaking API change.
