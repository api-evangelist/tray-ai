  - tool: list_connector_operations
    category: connectors
    rest: [get-connector-operations]
    binding: direct
    confidence: high
    note: >-
      Returns inputSchema.required, inputSchema.properties, hasDynamicOutput and `lookup` (DDL)
      objects — the same payload as
      GET /core/v1/connectors/{connector-name}/versions/{connector-version}/operations, but
      COMPACTED: advanced fields stripped and polymorphic branches replaced with `_collapsed`
      markers carrying `expand: ['<propName>']` hints. Extra MCP-only parameters:
      include_advanced, include_output_schema, expand.
  - tool: call_connector
    category: connectors
    rest: [call-connector]
    graphql: [call-connector]
    binding: direct
    confidence: high
    note: >-
      Same execution path as POST /core/v1/connectors/{name}/versions/{version}/call and the
      Embedded callConnector mutation. Takes auth_id and has_dynamic_output. Inherits the
      pass-through error trap — a 200 does not mean the downstream call succeeded.
  - tool: list_authentications
    category: authentication
    rest: [get-user-authentication, get-full-authentication]
    graphql: [get-authentications]
    binding: partial
    confidence: medium
    note: >-
      Filters by `service_name` (or a fragile keyword `search`). The published Platform spec has
      read-by-id and read-full but NO list-all authentications operation, so this tool is broader
      than any single REST operation and closest to the Embedded getAuthentications query.
