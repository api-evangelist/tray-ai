provider: Tray.ai
providerId: tray-ai
description: >-
  Binding between the tools Tray's remote MCP server exposes, its GraphQL Embedded API and its REST
  Platform API. The live tools/list is OAuth-gated, but Tray publishes the tool NAMES and many of
  their parameter names itself, in the SKILL.md files of its own tray-workflows plugin
  (github.com/trayio/tray-plugins, Apache-2.0) — so the tool column below is real, not inferred.
  Full inputSchemas still require authenticated introspection.

  The structural finding: Tray's MCP server is a projection of the WORKFLOW BUILDER, not of the
  public REST API. Only the connector and authentication tools have REST twins. Everything that
  makes the MCP server interesting — create a workflow, add steps, validate structure, fire an
  execution, read a step's input and output — has no public REST or GraphQL operation at all. And
  the entire Embedded (GraphQL) partner surface, plus workspace/user administration, the Trigger
  subscription pipeline, CDK deployment and solution releases, has no MCP tool.
