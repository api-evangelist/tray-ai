provider: Tray.ai
providerId: tray-ai
name: Tray MCP Server (Tray Headless MCP / Agent Gateway)
status: published
description: 'Tray.ai runs a first-party, hosted remote MCP server. Two surfaces exist and they are different
  products. (1) Tray Headless MCP — a Tray-hosted server at https://api.tray.io/mcp (with EU and APAC
  regional twins) that exposes the Tray PLATFORM itself as MCP tools: build and edit workflows, projects,
  connectors, authentication, validation, run and debug. (2) Agent Gateway — a governed MCP server your
  workspace publishes, at https://{workspace-id}.mcp.tray.ai, that exposes YOUR Tray workflows and connector
  operations as tools to your own AI clients. Both are reached over HTTP by an MCP client; Agent Gateway
  additionally supports a local stdio setup configured by `npx @trayio/tray-mcp` against an API token.'
deployment:
  mode: both
  endpoint: https://api.tray.io/mcp
  install: npx @trayio/tray-mcp
  package: https://www.npmjs.com/package/@trayio/tray-mcp
  auth: oauth
  verified: probed
  note: '`mode: both` is literal, not inferred. The remote endpoint was probed directly: POST {"jsonrpc":"2.0","id":1,"method":"tools/list"}
    to https://api.tray.io/mcp returned HTTP 401 with WWW-Authenticate: Bearer error="invalid_token",
    scope="mcp:list_tools mcp:call_tools", resource_metadata="https://api.tray.io/.well-known/oauth-protected-resource/mcp"
    — a live, RFC 9728-compliant MCP resource. The stdio path is Tray''s own documented alternative for
    clients that cannot do OAuth2: `npx @trayio/tray-mcp --workspace-id <UUID> --api-token <TOKEN>` writes
    the local client config, per Tray''s Connecting to Agent Gateway page.'
  probe_prior: (never probed)
  probe: gated
  probe_why: RFC 9728 challenge on the MCP path only
  checked: '2026-09-11'
  source: claimed-backlog re-probe 2026-09-11
