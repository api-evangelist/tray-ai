description: >-
  Tray's error catalogue, derived from the 4xx/5xx responses declared across the 70 operations in
  the two provider-published OpenAPI documents and enriched with the verbatim bodies in Tray's
  own error-handling pages. Tray does NOT use RFC 9457 problem+json: every error is the same flat
  JSON envelope with a human-readable `message` and a `code` that is, in every published example,
  null. There is no machine-readable error code registry — an agent has to string-match `message`,
  and Tray's own examples show `message` carrying multi-line JSON-Schema validation output.
