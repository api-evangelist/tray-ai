pass_through_errors:
  note: >-
    This is the single most important error-handling fact about Tray and it is easy to get wrong.
    A 200 from the Call Connector endpoint means only that the input payload and the authentication
    passed TRAY's validation. The third-party service's own error is returned INSIDE the 200 body.
    An agent that branches on HTTP status alone will read a failed Salesforce or Slack call as a
    success.
  source: https://tray.ai/documentation/developer/getting-started/troubleshooting/error-handling-3rd-party
  envelope_hint: 'Call Connector success bodies carry an `outcome` field (e.g. "outcome": "success") alongside `output`.'
gaps:
  - No stable machine-readable error code — `code` is null in every published example.
  - No application/problem+json, no `type` URI, no error documentation URLs in responses.
  - No error code index page; errors are described narratively across two troubleshooting pages.
