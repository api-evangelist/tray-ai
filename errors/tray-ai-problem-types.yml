problem_types:
  - status: 400
    title: Invalid input
    occurrences: 49
    apis: [Tray.ai Platform API]
    meaning: >-
      The request body failed Tray's input-schema validation, or a path/query value was malformed.
      For the Call Connector endpoint the message embeds the JSON Schema failure verbatim.
    examples:
      - message: 'Connector input validation failed. Schema validation errors: [ 1 - #: required key [channel] not found ]'
        cause: Required input missing for the connector operation.
      - message: 'Connector input validation failed. Schema validation errors: [ 1 - #/number_of_rows: expected type: Integer, found: String ]'
        cause: Input value of the wrong JSON type.
      - message: "Invalid value for: body (Couldn't decode a valid UUID at 'authId')"
        cause: authId is not a UUID / no such authentication exists.
      - message: "Invalid value for: body (Got value '\"5e7b53b2\"' with wrong type, expecting string at 'authId')"
        cause: Badly formed authId.
    remediation: >-
      Read the operation's inputSchema from GET /core/v1/connectors/{connector-name}/versions/{connector-version}/operations
      and re-shape the `input` object. Do not retry unchanged.
    retryable: false
  - status: 401
    title: Unauthorized
    occurrences: 70
    apis: [Tray.ai Platform API, Tray.ai Embedded API, Tray MCP Server]
    meaning: Missing, malformed or expired bearer token.
    examples:
      - message: The request is unauthorized
    mcp_variant:
      body: '{"error":"invalid_token","error_description":"Missing Authorization header"}'
      headers:
