  - status: 429
    title: Limit Exceeded
    occurrences: 49
    apis: [Tray.ai Platform API]
    meaning: >-
      The 30 requests-per-second / 1800 requests-per-minute rate limit was exceeded, or (on Call
      Connector) the 1000-concurrent-request ceiling was hit.
    retryable: true
    remediation: >-
      Exponential backoff. Tray publishes no RateLimit-* or Retry-After response headers, so the
