      note: >-
        The MCP endpoint uses an OAuth-shaped error object (error/error_description) rather than
        the REST `message` envelope — two different error shapes on the same host.
    remediation: Re-issue a master or user token; for MCP, run the OAuth2 flow named in resource_metadata.
    retryable: false
  - status: 403
    title: Forbidden
    occurrences: 70
    apis: [Tray.ai Platform API, Tray.ai Embedded API]
    meaning: >-
